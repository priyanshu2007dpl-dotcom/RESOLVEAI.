version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omni_resolve_postgres
    restart: always
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_secure_password_2026
      POSTGRES_DB: omni_resolve_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_user -d omni_resolve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: omni_resolve_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://omni_user:omni_secure_password_2026@postgres:5432/omni_resolve_db
      SECRET_KEY: omni-resolve-enterprise-secret-key-prod-2026
    ports:
      - "8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: omni_resolve_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
